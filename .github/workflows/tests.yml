name: Pruebas del sistema

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API y pruebas .NET
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar API
        run: dotnet build Optica.Api/Optica.Api.csproj --configuration Release
      - name: Ejecutar todos los proyectos de pruebas
        shell: bash
        run: |
          mapfile -d '' proyectos < <(find tests -name '*Tests.csproj' -print0)
          test "${#proyectos[@]}" -gt 0
          for proyecto in "${proyectos[@]}"; do
            nombre=$(basename "$proyecto" .csproj)
            dotnet test "$proyecto" --configuration Release --logger "trx;LogFileName=$nombre.trx" --results-directory "$GITHUB_WORKSPACE/TestResults"
          done
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend
          path: TestResults/**/*.trx
          if-no-files-found: warn

  frontend:
    name: Pruebas y compilación Angular
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Optica_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Optica_front/package-lock.json
      - run: npm ci
      - name: Ejecutar todas las pruebas Angular
        run: npm test -- --watch=false
      - name: Compilar frontend
        run: npm run build

  e2e:
    name: E2E con Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar estabilidad de red y APT
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf > /dev/null
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-timeouts > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Optica_front/package-lock.json
      - name: Instalar dependencias del frontend
        working-directory: Optica_front
        run: npm ci
      - name: Instalar Chromium y dependencias de Playwright
        working-directory: Optica_front
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break || {
              if [ "$i" -eq 3 ]; then
                echo "Error: Fallaron los reintentos de instalación de Playwright."
                exit 1
              fi
              echo "Aviso: Reintentando instalación de Playwright ($i/3)..."
              sleep 5
            }
          done
      - name: Generar contraseña temporal de MySQL E2E
        id: password
        shell: bash
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'E2E_MYSQL_ROOT_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Construir e iniciar Compose E2E
        id: compose_up
        run: docker compose -f docker-compose.e2e.yml up --build --force-recreate --remove-orphans --detach --wait --wait-timeout 180
      - name: Ejecutar prueba E2E completa
        working-directory: Optica_front
        run: npm run e2e
      - name: Guardar logs de servicios E2E si falla
        if: failure() && steps.compose_up.outcome != 'skipped'
        shell: bash
        run: |
          mkdir -p Optica_front/test-results
          docker compose -f docker-compose.e2e.yml logs --no-color database backend frontend mailpit \
            | sed -E 's/(Password|password)=([^;[:space:]]+)/\1=[REDACTED]/g; s#(/acciones/(confirmar|cancelar)/)[A-Za-z0-9_-]+#\1[REDACTED]#g; s/E2E-Admin-Acceso-[A-Za-z0-9_-]+!?/[REDACTED-E2E-PASSWORD]/g' \
            > Optica_front/test-results/compose-services.log
      - name: Redactar secretos de las evidencias E2E
        if: failure()
        run: python .github/scripts/sanitize-e2e-artifacts.py
      - name: Retirar únicamente el entorno E2E
        if: always() && steps.password.outcome == 'success'
        run: docker compose -f docker-compose.e2e.yml down --remove-orphans
      - name: Guardar evidencias Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Optica_front/playwright-report/
            Optica_front/test-results/
          if-no-files-found: warn
          retention-days: 14
