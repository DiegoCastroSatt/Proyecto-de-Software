services:

  database:
    image: mysql:8.0
    container_name: optica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: optica_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - optica_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build:
      context: ./Optica.Api
      dockerfile: Dockerfile
    container_name: optica-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Optica.Api/wwwroot/uploads:/app/wwwroot/uploads
      - optica_data_protection_keys:/var/opt/optica-dp-keys
    environment:
      ConnectionStrings__OpticaDb: "Server=database;Port=3306;Database=optica_db;User=root;Password=${MYSQL_ROOT_PASSWORD};"
      Correo__SmtpHost: ${SMTP_HOST:-}
      Correo__Puerto: ${SMTP_PORT:-587}
      Correo__Usuario: ${SMTP_USERNAME:-}
      Correo__Clave: ${SMTP_PASSWORD:-}
      Correo__Remitente: ${SMTP_FROM:-}
      Correo__NombreRemitente: ${SMTP_FROM_NAME:-Centro Óptico San Francisco}
      Correo__UrlBaseApi: ${EMAIL_API_BASE_URL:-http://localhost:8080}
      Correo__UsarTls: ${SMTP_USE_TLS:-true}
      DataProtection__KeysPath: /var/opt/optica-dp-keys
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./Optica_front
      dockerfile: Dockerfile
    container_name: optica-frontend
    restart: unless-stopped
    ports:
      - "4200:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  optica_mysql_data:
  optica_data_protection_keys:
