services:

  database:
    image: mysql:8.0
    container_name: optica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: optica_db
    ports:
      - "3307:3306"
    volumes:
      - optica_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build:
      context: ./Optica.Api
      dockerfile: Dockerfile
    container_name: optica-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__OpticaDb: "Server=database;Port=3306;Database=optica_db;User=root;Password=${MYSQL_ROOT_PASSWORD};"
    depends_on:
      - database

volumes:
  optica_mysql_data: