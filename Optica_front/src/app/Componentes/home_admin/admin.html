<div class="admin-shell">
  <header class="admin-header">
    <a class="brand" routerLink="/inicio" aria-label="Centro Óptico San Francisco, inicio">
      <img class="brand-logo" src="/images/favicon-san-francisco-transparente.png" alt="Óptica San Francisco" width="72" height="72">
    </a>

    <nav aria-label="Navegación del administrador">
      <a routerLink="/admin/panel" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

      <a routerLink="/admin/panel/horarios" routerLinkActive="is-active"> Horarios </a>

      <a routerLink="/admin/panel/agenda" routerLinkActive="is-active"> Agenda </a>

      <a routerLink="/admin/panel/clientes" routerLinkActive="is-active">Clientes</a>

      <a routerLink="/admin/panel/productos" routerLinkActive="is-active">Catálogo</a>

      <a routerLink="/admin/panel/stock" routerLinkActive="is-active">Consultar Stock</a>

      <a routerLink="/admin/panel/productos/nuevo" routerLinkActive="is-active">Nuevo Producto</a>

      <a routerLink="/admin/panel/ventas" routerLinkActive="is-active"> Ventas </a>

      <a routerLink="/admin/panel/recetas" routerLinkActive="is-active"> Recetas </a>

      <a routerLink="/admin/panel/pedido" routerLinkActive="is-active"> Pedidos </a>

      <a routerLink="/admin/panel/crear-pedido" routerLinkActive="is-active">Crear Pedido</a>
    </nav>
    <div class="sesion-admin">
      @if (sesion.administrador(); as admin) { <span>{{ admin.nombre }}</span> }
      <button type="button" (click)="salir()">
        <span>Cerrar sesión</span>
        <svg class="icono-salir" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M14 5V3H4v18h10v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15 7v3H9v4h6v3l7-5Z" fill="currentColor" />
        </svg>
      </button>
      @if (errorSesion()) { <small role="alert">{{ errorSesion() }}</small> }
    </div>
  </header>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
