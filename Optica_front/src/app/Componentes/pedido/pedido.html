<div class="app-shell">

  <main class="order-page">
    <section class="order-shell">

      <div class="order-form-area">
        <div class="form-heading">
          <h2>Lista de Pedidos</h2>
          <button type="button" class="btn-primary" routerLink="/admin/panel/crear-pedido">Crear Pedido</button>
        </div>

        <div class="search-bar-container">
          <input type="search" class="search-input" placeholder="Buscar pedido por cliente" />
        </div>

        @if (pedidos().length === 0) {
        <div class="empty-state">
          <p class="empty-title">Sin pedidos</p>
          <p class="empty-subtitle">No hay pedidos registrados en el sistema.</p>
        </div>
        } @else {
        <div class="pedidos-list">
          @for (pedido of pedidos(); track pedido.idPedido) {
          <div class="pedido-card">
            <div class="pedido-info">
              <span class="pedido-cliente">{{ pedido.nombreCliente }}</span>
              <span class="pedido-fecha">{{ pedido.fecha | date:'dd/MM/yyyy' }}</span>
              <span class="pedido-total">Total: ${{ pedido.total }}</span>
            </div>
            <select class="pedido-estado" [attr.data-estado]="pedido.estado" [value]="pedido.estado" (change)="cambiarEstado(pedido, $event)">
              <option value="Pendiente">Pendiente</option>
              <option value="En proceso">En proceso</option>
              <option value="Listo">Listo</option>
              <option value="Entregado">Entregado</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>
          }
        </div>
        }
      </div>
    </section>
  </main>
</div>
