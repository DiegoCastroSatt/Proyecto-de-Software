<div class="app-shell">

  <main class="order-page">
    <section class="order-shell">
      <div class="order-form-area">
        <div class="form-heading">
          <h2>Crear Pedido</h2>
          <button type="button" class="btn-secondary" routerLink="admin/pedido">Volver a Pedidos</button>
        </div>

        <div class="form-container">
          <form [formGroup]="pedidoForm" (ngSubmit)="submitPedido()">

            <div class="form-group">
              <label for="cliente">Nombre del Cliente</label>
              <select id="cliente" formControlName="nombreCliente" class="form-control">
                <option value="" disabled>Seleccione un cliente</option>
                @for (cliente of clientes(); track cliente.idCliente) {
                <option [value]="cliente.nombreCompleto">{{ cliente.nombreCompleto }}</option>
                }
              </select>
              @if (hasError('nombreCliente', 'required')) {
              <span class="error-text">El cliente es obligatorio</span>
              }
            </div>

            <div class="form-group">
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" formControlName="fecha" class="form-control">
              @if (hasError('fecha', 'required')) {
              <span class="error-text">La fecha es obligatoria</span>
              }
            </div>

            <div class="form-group">
              <label for="anotaciones">Anotaciones Adicionales</label>
              <textarea id="anotaciones" formControlName="anotaciones" class="form-control" rows="4"
                placeholder="Anotaciones para el pedido..."></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'Guardando...' : 'Guardar Pedido' }}
              </button>
            </div>

            @if (errorMessage()) {
            <div class="error-banner">{{ errorMessage() }}</div>
            }
            @if (successMessage()) {
            <div class="success-banner">{{ successMessage() }}</div>
            }

          </form>
        </div>
      </div>
    </section>
  </main>
</div>
