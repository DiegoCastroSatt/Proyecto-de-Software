<div class="client-shell">
  <header class="client-header">
    <a class="brand" routerLink="/inicio" aria-label="Centro Óptico San Francisco, inicio">
      <img class="brand-logo" src="/assets/images/favicon-san-francisco-transparente.png" alt="Óptica San Francisco" width="1254" height="1254">
    </a>

    <nav aria-label="Navegación del cliente">
      <a routerLink="/inicio" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/reservas" routerLinkActive="is-active">Agendar reserva</a>
      <a routerLink="/recomendador-marcos" routerLinkActive="is-active">Recomendador de marcos</a>
      <a routerLink="/probador-marcos" routerLinkActive="is-active">Probar marcos</a>
      <a routerLink="/productos" routerLinkActive="is-active">Productos</a>
      @if (authService.cliente()) {
        <a routerLink="/consultar-pedido" routerLinkActive="is-active">Mis pedidos</a>
      }
    </nav>
    @if (authService.cliente(); as cliente) {
      <a class="login-button is-logged" routerLink="/cliente/en-trabajo">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
        </svg>
        <span>{{ cliente.nombre }}</span>
      </a>
    } @else {
      <a class="login-button" routerLink="/logincliente">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
        </svg>
        <span>Iniciar sesión</span>
      </a>
    }
  </header>

  <main class="client-content">
    <router-outlet></router-outlet>
  </main>

</div>
