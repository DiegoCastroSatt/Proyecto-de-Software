<div class="client-shell">
  <header class="client-header">
    <a class="brand" routerLink="/inicio" aria-label="Centro Óptico San Francisco, inicio">
      <img class="brand-logo" src="/images/favicon-san-francisco-transparente.png" alt="Óptica San Francisco" width="1254" height="1254">
    </a>

    <nav aria-label="Navegación del cliente">
      <a routerLink="/inicio" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/reservas" routerLinkActive="is-active">Agendar reserva</a>
      <a routerLink="/productos" routerLinkActive="is-active">Productos</a>
    </nav>
  </header>

  <main class="client-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="client-footer">
    <a routerLink="/admin/panel">Acceso administrador</a>
  </footer>
</div>
